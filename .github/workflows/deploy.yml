name: Build & Deploy

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    # Self-hosted runner on the target VPS (srv1055555).
    # This avoids external SSH timeouts and GitHub runner IP whitelisting issues.
    # Runner must be registered with label 'self-hosted' (default) and have Node 24 + git available.
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npx @11ty/eleventy

      - name: Deploy to server
        run: |
          set -e
          TARGET=/srv/accordant-web
          cd "$TARGET"
          git pull --ff-only
          rm -rf "$TARGET/_site"
          cp -r "$GITHUB_WORKSPACE/_site" "$TARGET/"
          echo "Deployed: $(git rev-parse --short HEAD)"