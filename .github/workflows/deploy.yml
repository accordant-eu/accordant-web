name: Build & Deploy

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    # Self-hosted runner on the target VPS (srv1055555).
    # This avoids external SSH timeouts and GitHub runner IP whitelisting issues.
    # Runner must be registered with label 'self-hosted' (default) and have Node 24 + git available.
    runs-on: self-hosted

    steps:
      - name: Force clean clone
        run: |
          set -e
          rm -rf "$GITHUB_WORKSPACE"
          mkdir -p "$GITHUB_WORKSPACE"
          git clone --depth 1 https://github.com/accordant-eu/accordant-web.git "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git checkout ${{ github.sha }}
          echo "Checked out: $(git rev-parse --short HEAD)"

      - name: Checkout (fallback)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npx @11ty/eleventy

      - name: Verify build output
        run: |
          set -e
          if ! head -1 "$GITHUB_WORKSPACE/_site/index.html" | grep -q "<!DOCTYPE html>"; then
            echo "ERROR: Built index.html is missing <!DOCTYPE html>"
            head -5 "$GITHUB_WORKSPACE/_site/index.html"
            exit 1
          fi
          if ! grep -q "Two AI systems, one codebase" "$GITHUB_WORKSPACE/_site/index.html"; then
            echo "ERROR: Case study section missing from built index.html"
            exit 1
          fi
          echo "Build verification passed"

      - name: Fix permissions on target _site
        run: |
          TARGET=/srv/accordant-web
          sudo chown -R github-runner:github-runner "$TARGET/_site" 2>/dev/null || true

      - name: Deploy to server
        run: |
          set -e
          TARGET=/srv/accordant-web
          rm -rf "$TARGET/_site"
          cp -r "$GITHUB_WORKSPACE/_site" "$TARGET/"
          echo "Deployed: $(git rev-parse --short HEAD)"